<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="800" height="40" fill="url(#fade)"/></mask>
    <g id="set">
      <g transform="translate(0,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">JavaScript</text></g>
      <g transform="translate(110,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">React</text></g>
      <g transform="translate(220,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">Node.js</text></g>
      <g transform="translate(330,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">Express</text></g>
      <g transform="translate(440,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">MongoDB</text></g>
      <g transform="translate(550,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">MySQL</text></g>
      <g transform="translate(660,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">Tailwind CSS</text></g>
      <g transform="translate(770,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">OpenAI API</text></g>
      <g transform="translate(880,5)"><rect width="100" height="30" rx="15"/><text x="50" y="20">Git</text></g>
    </g>
  </defs>
  <style>
    rect { fill: none; stroke: #768390; stroke-width: 1; opacity: 0.6; }
    text { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #768390; text-anchor: middle; }
    .track { animation: scroll 24s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-990px); } }
  </style>
  <g mask="url(#edge)">
    <g class="track">
      <use href="#set"/>
      <use href="#set" x="990"/>
    </g>
  </g>
</svg>
